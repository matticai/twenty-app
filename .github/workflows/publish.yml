# Twenty's own publish workflow, from .github/workflows-temp/publish.yml.
#
# Publishes the app to npm with provenance (npm trusted publishing).
# No Twenty workspace URL and no API key. After npm shows the version, claim
# @1eye/twenty-app in https://1eye.twenty.com at
# Settings > Developers > Apps. Claim with GitHub checks this provenance, so
# the repository must be public before the tag is pushed. Do not set
# TWENTY_APP_PUBLISH_DISABLE_PROVENANCE.
#
# One-time setup, on the day of the release:
# 1. On npmjs.com open the package > Settings > Trusted Publisher and register
#    matticai/twenty-app and publish.yml. Allow direct npm publish.
#    See https://docs.npmjs.com/trusted-publishers
# 2. Push a version tag that matches package.json, currently v0.1.1.
#
# https://docs.twenty.com/developers/extend/apps/operations/publishing#publish-%E2%80%94-publish-yml

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC provenance).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          # No registry-url. setup-node would write an empty npm token and
          # npm would skip the GitHub OIDC trusted publisher.

      - name: Update npm
        # Trusted publishing requires npm 11.5.1 or later. npm 12 requires
        # Node 24.15.0 or newer, and .nvmrc is 24.5.0.
        run: npm install -g npm@11.21.2

      - name: Install Twenty CLI
        run: npm install -g twenty@2.53.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish to npm
        # Unset ONEEYE_ENV builds the production identity (https://api.1eye.ai).
        run: twenty app publish
