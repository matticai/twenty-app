# Install the production identity into the 1eye publisher workspace.
#
# Repository variable TWENTY_PUBLISHER_API_URL.
# GitHub environment twenty-publisher, with a required reviewer:
#   secret TWENTY_PUBLISHER_API_KEY  (owner of the publisher workspace)
#
# Create that environment and its reviewer before the first run. GitHub
# otherwise creates the environment with no reviewer when this job is queued.
# The API key must belong to an owner. Apply from any other account fails
# with a permission error and leaves the production app unchanged.
# Type apply-publisher to queue the job. Pass create=true only for the first
# registration of the production identity.

name: Apply publisher

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type apply-publisher to install the production app"
        required: true
        type: string
      create:
        description: "Register the production application. Use on the first install only."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apply-publisher
  cancel-in-progress: false

jobs:
  apply:
    name: apply-publisher
    if: inputs.confirm == 'apply-publisher'
    uses: MatticAI/github-actions/.github/workflows/reusable-twenty-apply.yml@develop
    with:
      github-environment: twenty-publisher
      oneeye-env: prod
      api-url: ${{ vars.TWENTY_PUBLISHER_API_URL }}
      cli-version: "2.53.0"
      create: ${{ inputs.create }}
    secrets:
      api-key: ${{ secrets.TWENTY_PUBLISHER_API_KEY }}
