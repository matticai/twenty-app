# Lint, typecheck, unit tests, and integration tests against a disposable Twenty server.
# The jobs live in MatticAI/github-actions.
#
# No Twenty URL and no API key. The integration job starts its own server.
# This does not install the app into https://1eye.twenty.com.

name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: MatticAI/github-actions/.github/workflows/reusable-twenty-ci.yml@develop
    with:
      twenty-image-tag: v2.53.1
      cli-version: "2.53.0"
