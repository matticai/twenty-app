# Install the dev identity into the testing Twenty workspace.
#
# Repository variable TWENTY_TESTING_API_URL.
# GitHub environment twenty-testing:
#   secret TWENTY_TESTING_API_KEY
#
# Create that environment before the first run. A pull request applies only
# after someone adds the deploy label. New commits do not re-apply until the
# label is added again. Pass create=true only for the first registration of
# application id f7b053db-1b9a-4b91-8d23-d838bbc6e2ee.

name: Apply testing

on:
  workflow_dispatch:
    inputs:
      create:
        description: "Register this dev application id. Use on the first install only."
        required: false
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: apply-testing
  cancel-in-progress: false

jobs:
  apply:
    name: apply-testing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy')
    uses: MatticAI/github-actions/.github/workflows/reusable-twenty-apply.yml@develop
    with:
      github-environment: twenty-testing
      oneeye-env: dev
      application-id: f7b053db-1b9a-4b91-8d23-d838bbc6e2ee
      api-url: ${{ vars.TWENTY_TESTING_API_URL }}
      cli-version: "2.53.0"
      create: ${{ github.event_name == 'workflow_dispatch' && inputs.create }}
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      api-key: ${{ secrets.TWENTY_TESTING_API_KEY }}
